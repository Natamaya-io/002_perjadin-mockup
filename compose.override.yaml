version: '3.8'

services:
  frontend:
    build: !reset null
    image: public.ecr.aws/docker/library/node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
      - BACKEND_URL=http://backend:8081

  backend:
    volumes:
      - ./backend/templates:/app/templates